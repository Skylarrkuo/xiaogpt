[project]
name = "xiaogpt"
description = "Play ChatGPT or other LLM with xiaomi AI speaker"
readme = "README.md"
authors = [
    {name = "yihong0618", email = "zouzou0208@gmail.com"},
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.9,<3.13"
dependencies = [
    "miservice_fork",
    "openai>=1",
    "aiohttp",
    "rich",
    "httpx[socks]",
    # xiaogpt/utils.py 里用了 requests.utils.cookiejar_from_dict。
    # 过去它是被 langchain / dashscope 顺带装上的，那几个包已随 bot 一起删掉，
    # 这里必须显式声明，否则干净环境会在 import 期就崩。
    "requests",
    "tetos>=0.2.1",
    "pyyaml>=6.0.1",
    # lingua doesn't ship wheels for python 3.13 nor sdist
    "lingua-language-detector>=2.0.2; python_version < \"3.13\"",
]
license = {text = "MIT"}
dynamic = ["version", "optional-dependencies"]

[project.urls]
Homepage = "https://github.com/yihong0618/xiaogpt"

[project.scripts]
xiaogpt = "xiaogpt.cli:main"

[tool.pdm]
plugins = ["pdm-autoexport"]
dev-dependencies = {dev = ["black"]}

[tool.pdm.version]
source = "scm"

[tool.pdm.build]
includes = ["xiaogpt/"]
locked = true

[[tool.pdm.autoexport]]
filename = "requirements.txt"
without-hashes = true

[build-system]
requires = ["pdm-backend>=2.0.0", "pdm-build-locked"]
build-backend = "pdm.backend"
